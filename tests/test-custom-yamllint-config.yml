name: Test custom yamllint config via yamllint_flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
          yamllint_flags: >-
            -c tests/fixtures/permissive-yamllint.yaml
            tests/fixtures/invalid.yaml
      - name: Assert action succeeded with rules disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with offending rules disabled"
            exit 1
          fi
          echo "PASS"
