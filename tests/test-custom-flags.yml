name: Test yamllint with custom flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: "dummy-token"
          reporter: "local"
          filter_mode: "nofilter"
          fail_level: "none"
          level: "warning"
          yamllint_flags: "-d relaxed pristine/reviewdog--action-yamllint/v1.20.1/testdata/test.yaml"
      - name: Assert action completed with relaxed config
        run: |
          echo "Action completed successfully with custom yamllint flags"
          echo "PASS"
