name: Test custom yamllint flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          # Use a config file that disables line-length and document-start rules
          yamllint_flags: "-c tests/fixtures/configs/relaxed.yaml tests/fixtures/longlines/longline.yaml"

      - name: Assert action succeeded with relaxed yamllint config
        run: |
          echo "PASS: yamllint action ran successfully with custom config disabling line-length rule"
