name: Test yamllint - warning level reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid YAML file with no issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/clean.yaml" << 'EOF'
          ---
          name: clean-example
          version: "1.0.0"
          enabled: true
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          yamllint_flags: "tests/fixtures/clean"

      - name: Assert action ran successfully on clean YAML with warning level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded on clean YAML with warning level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail on clean YAML with fail_level=none"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
