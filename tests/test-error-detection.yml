name: Test yamllint error detection (invalid YAML)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid YAML file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/invalid"
          # Create a YAML file with indentation errors (yamllint will flag these)
          printf 'key: value\n  bad_indent: here\nanother: item\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/invalid/bad.yaml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          yamllint_flags: "tests/fixtures/invalid"

      - name: Assert action failed due to YAML errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when linting invalid YAML with fail_level=error"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (yamllint may not flag this as error-level)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
