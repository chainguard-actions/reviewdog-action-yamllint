name: Test warning level reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          yamllint_flags: "tests/fixtures/warnings/simple.yaml"

      - name: Assert action completed successfully with warning level
        run: |
          echo "PASS: yamllint action ran successfully with level=warning"
