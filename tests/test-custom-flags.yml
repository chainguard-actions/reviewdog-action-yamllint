name: Test yamllint with custom flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create YAML files and a relaxed yamllint config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom"
          # Create a yamllint config that is very relaxed
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom/.yamllint.yml" <<'EOF'
          ---
          extends: relaxed
          rules:
            line-length:
              max: 200
          EOF
          # Create a YAML file that would fail strict rules but pass relaxed ones
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom/config.yaml" <<'EOF'
          ---
          key: value
          list:
            - item1
            - item2
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          yamllint_flags: "-c tests/fixtures/custom/.yamllint.yml tests/fixtures/custom/config.yaml"

      - name: Assert action completed with custom flags
        run: |
          echo "PASS: yamllint ran successfully with custom config flags"
