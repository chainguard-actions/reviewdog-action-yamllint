name: Test invalid YAML detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          yamllint_flags: "tests/fixtures/invalid/bad.yaml"

      - name: Assert action completed (fail_level=none means exit 0 even with issues)
        run: |
          echo "PASS: yamllint action ran and reported issues without failing (fail_level=none)"
