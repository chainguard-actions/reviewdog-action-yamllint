name: Test yamllint with github-check reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a valid YAML file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/check-reporter"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/check-reporter/app.yaml" <<'EOF'
          ---
          application:
            name: myapp
            version: "2.0.0"
            settings:
              debug: false
              timeout: 30
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: warning
          yamllint_flags: "tests/fixtures/check-reporter"

      - name: Assert action ran (github-check reporter may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with github-check reporter"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for github-check)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
