name: Test detection of invalid YAML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid YAML file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/yamllint-invalid"
          # Create a YAML file with intentional errors (bad indentation, trailing spaces)
          printf 'key: value  \nother:\n  - item1\n   - item2\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/yamllint-invalid/invalid.yaml"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          filter_mode: nofilter
          fail_level: any
          yamllint_flags: "tests/fixtures/yamllint-invalid/"
        continue-on-error: true

      - name: Assert action detected issues in invalid YAML
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=any and invalid YAML, the action should fail (exit 1)
          # because yamllint will find issues
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected YAML issues and exited with failure"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully (yamllint may have found no issues with this content)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
