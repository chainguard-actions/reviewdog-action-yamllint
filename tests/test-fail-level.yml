name: Test fail_level - detect YAML errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: any
          yamllint_flags: tests/fixtures/bad.yaml

      - name: Assert action detected YAML issues and exited non-zero
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to YAML issues but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly detected YAML issues"
