name: Test yamllint - lint specific file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a specific YAML file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/specific"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/specific/target.yaml" << 'EOF'
          ---
          key: value
          list:
            - item1
            - item2
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          yamllint_flags: "tests/fixtures/specific/target.yaml"

      - name: Assert action ran on specific file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action successfully linted a specific YAML file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail on valid YAML with fail_level=none"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
