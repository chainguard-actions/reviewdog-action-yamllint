name: Test fail_level error exits non-zero on lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create an invalid YAML fixture with syntax error
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pristine/reviewdog--action-yamllint/v1.20.1/tests/fixtures/syntax-error"
          printf -- '---\nkey: [\n' \
            > "$GITHUB_WORKSPACE/pristine/reviewdog--action-yamllint/v1.20.1/tests/fixtures/syntax-error/broken.yaml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "dummy-token"
          reporter: "local"
          filter_mode: "nofilter"
          fail_level: "error"
          yamllint_flags: "pristine/reviewdog--action-yamllint/v1.20.1/tests/fixtures/syntax-error/broken.yaml"
      - name: Assert action failed due to lint errors with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error and invalid YAML, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when lint errors found and fail_level=error"
