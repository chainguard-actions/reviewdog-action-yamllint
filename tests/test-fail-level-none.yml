name: Test fail_level none always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify testdata file has yamllint issues
        run: |
          # The testdata/test.yaml file has known style issues (long lines, etc.)
          # We verify yamllint detects them
          echo "testdata/test.yaml contents:"
          cat testdata/test.yaml
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          yamllint_flags: "testdata/test.yaml"
      - name: Assert action exited 0 with fail_level=none
        run: |
          echo "Action exited 0 as expected with fail_level=none"
          echo "PASS"
