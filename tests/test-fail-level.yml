name: Test fail_level causes non-zero exit on errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          # Use a config file that enables key-duplicates detection
          yamllint_flags: "-c tests/fixtures/configs/strict-duplicates.yaml tests/fixtures/errors/duplicate.yaml"

      - name: Assert action failed due to yamllint errors with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error and YAML errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when yamllint found errors and fail_level=error"
