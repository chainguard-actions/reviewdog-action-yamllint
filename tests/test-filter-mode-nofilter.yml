name: Test filter_mode nofilter with warning level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create YAML fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/nofilter"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/nofilter/config.yaml" << 'EOF'
          ---
          server:
            host: localhost
            port: 8080
          database:
            name: mydb
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          yamllint_flags: "tests/fixtures/nofilter"
        continue-on-error: true

      - name: Assert action ran with nofilter mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with nofilter mode and warning level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
